name: A股指定日期报告（每日自动）

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC；UTC 11:30 = 北京时间 19:30
    # 调度可能延迟数小时；report_date.py 按任务创建时间还原最近的计划日期
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '可选：补跑日期 YYYY-MM-DD；留空使用已收盘日期'
        required: false
        type: string
      upload_artifact:
        description: '额外保存 GitHub PDF 附件（需要可用的 Artifact 存储额度）'
        type: boolean
        default: false
  push:
    paths:
      - 'apps-script/**'
      - 'tests/test_apps_script_gateway.cjs'
      - '.github/workflows/report-by-date*.yml'
      - 'scripts/report_date.py'
      - 'tests/test_report_date.py'
      - 'scripts/publish_report.py'
      - 'src/apps_script_storage.py'
      - 'tests/test_publish_report.py'
      - 'tests/test_apps_script_storage.py'
      - 'scripts/pdf_drive.py'
      - 'tests/test_pdf_fonts.py'
      - 'src/report-by-date.ts'
      - 'src/lib/**'
      - 'tests/report-metrics.test.ts'
      - 'tests/report-render.test.ts'
      - 'tests/fixtures/**'
  pull_request:
    paths:
      - 'apps-script/**'
      - 'tests/test_apps_script_gateway.cjs'
      - '.github/workflows/report-by-date*.yml'
      - 'scripts/report_date.py'
      - 'tests/test_report_date.py'
      - 'scripts/publish_report.py'
      - 'src/apps_script_storage.py'
      - 'tests/test_publish_report.py'
      - 'tests/test_apps_script_storage.py'
      - 'scripts/pdf_drive.py'
      - 'tests/test_pdf_fonts.py'
      - 'src/report-by-date.ts'
      - 'src/lib/**'
      - 'tests/report-metrics.test.ts'
      - 'tests/report-render.test.ts'
      - 'tests/fixtures/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: report-by-date-daily-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 安装测试依赖
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: 安装 PDF 中文字体与检查工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-cjk poppler-utils
          fc-cache -f
      - name: 验证日期、报告发布和上传重试
        run: python -m pytest tests -q
        env:
          REQUIRE_PDF_FONT_TEST: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 验证价格、换手率、机构资金与完整报表
        run: node --test tests/report-metrics.test.ts tests/report-render.test.ts
      - name: 验证每日行情云盘目录与上传协议
        run: node --test tests/test_apps_script_gateway.cjs

  report:
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: gdrive-apps-script-archive
      cancel-in-progress: false
    env:
      GDRIVE_APPS_SCRIPT_URL: ${{ secrets.GDRIVE_APPS_SCRIPT_URL }}
      GDRIVE_APPS_SCRIPT_TOKEN: ${{ secrets.GDRIVE_APPS_SCRIPT_TOKEN }}
      GDRIVE_APPS_SCRIPT_MAX_BYTES: ${{ vars.GDRIVE_APPS_SCRIPT_MAX_BYTES || '36700160' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装 Drive 上传依赖
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: 安装 PDF 中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-cjk
          fc-cache -f
          python -c 'from scripts.pdf_drive import _require_chinese_font; _require_chinese_font()'

      - name: 确定北京时间报告日期
        id: report-date
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          report_date="$(python scripts/report_date.py --date "$REQUESTED_DATE")"
          echo "date=${report_date}" >> "$GITHUB_OUTPUT"
          echo "北京时间报告日期：${report_date}"

      - name: 生成当日指定日期报告
        id: generate
        shell: bash
        env:
          REPORT_DATE: ${{ steps.report-date.outputs.date }}
        run: |
          rm -f "reports/${REPORT_DATE}.html"
          set +e
          bun run src/report-by-date.ts "$REPORT_DATE" 2>&1 | tee /tmp/report-by-date.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            if [ ! -s "reports/${REPORT_DATE}.html" ]; then
              echo "::error::脚本成功退出但没有生成 HTML 报告"
              exit 1
            fi
            echo "generated=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -q "不是交易日" /tmp/report-by-date.log; then
            echo "${REPORT_DATE} 不是交易日，正常跳过。"
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "报告生成失败，退出码：${status}"
          exit "$status"

      - name: 提交 HTML 报告
        if: steps.generate.outputs.generated == 'true'
        shell: bash
        env:
          REPORT_DATE: ${{ steps.report-date.outputs.date }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python scripts/publish_report.py --date "$REPORT_DATE" --branch "$TARGET_BRANCH"

      - name: 生成 PDF 并上传 Google Drive
        id: pdf
        if: ${{ !cancelled() && steps.generate.outputs.generated == 'true' }}
        shell: bash
        env:
          REPORT_DATE: ${{ steps.report-date.outputs.date }}
        run: |
          python scripts/pdf_drive.py report \
            --html "reports/${REPORT_DATE}.html" \
            --pdf "reports/${REPORT_DATE}.pdf" \
            --date "$REPORT_DATE" \
            --upload-drive

      - name: 可选的 GitHub PDF 备份
        id: artifact
        if: ${{ !cancelled() && inputs.upload_artifact == true && steps.pdf.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: a-share-report-${{ steps.report-date.outputs.date }}
          path: reports/${{ steps.report-date.outputs.date }}.pdf
          if-no-files-found: error
          retention-days: 7

      - name: 提示附件备份失败
        if: ${{ !cancelled() && steps.artifact.outcome == 'failure' }}
        run: |
          echo "::warning::GitHub 附件备份失败。HTML 提交和云盘归档步骤已独立执行，请分别查看其状态。"
